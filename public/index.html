<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Giới Thiệu - Phạm Anh Tú</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f2f5; color: #333; line-height: 1.6; }
        .top-banner { background: #1e293b; color: #f59e0b; padding: 12px 0; font-size: 16px; font-weight: bold; }
        .main-container { max-width: 600px; margin: 20px auto; background: #fff; border-radius: 10px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .profile-header { text-align: center; margin-bottom: 20px; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #2563eb; margin-bottom: 10px; }
        .section { margin-bottom: 20px; }
        .info-card { background: #f8fafc; padding: 10px 15px; border-radius: 6px; margin-top: 5px; border-left: 4px solid #2563eb; }
        textarea { width: 100%; height: 80px; padding: 8px; margin-top: 8px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #5865F2; color: #fff; border: none; border-radius: 5px; font-weight: bold; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-banner"><marquee id="banner-text">Đang tải thông điệp...</marquee></div>
    <div class="main-container">
        <div class="profile-header">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Phamanhtu" class="avatar">
            <h2>Phạm Anh Tú</h2>
            <p>ĐH Công Nghệ Thông Tin & Truyền Thông Việt - Hàn</p>
        </div>
        <div class="section">
            <h3>📌 Thông Tin Sinh Viên</h3>
            <div class="info-card">Mã SV: <b>24NS067</b> | Lớp: <b>24NS</b></div>
        </div>
        <div class="section">
            <h3>⚽ Sở Thích & Thành Tích</h3>
            <div class="info-card">Sở thích: Đá bóng<br>Thành tích: Đạt giải cao môn Điền Kinh</div>
        </div>
        <div class="section">
            <h3>📩 Gửi Thông Điệp</h3>
            <textarea id="msgInput" placeholder="Nhập lời nhắn..."></textarea>
            <button onclick="sendMessage()">Gửi Về Điện Thoại (Discord)</button>
            <p id="status" style="margin-top:8px; font-weight:bold;"></p>
        </div>
    </div>
    <script>
        async function loadBanner() {
            try {
                const res = await fetch('/api/get-banner');
                const data = await res.json();
                document.getElementById('banner-text').innerText = data.banner;
            } catch (e) {}
        }
        async function sendMessage() {
            const message = document.getElementById('msgInput').value;
            const status = document.getElementById('status');
            if (!message) return alert('Vui lòng nhập nội dung!');
            status.innerText = 'Đang gửi...';
            try {
                const res = await fetch('/api/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                status.innerText = data.msg;
                if (data.success) document.getElementById('msgInput').value = '';
            } catch (e) { status.innerText = 'Lỗi kết nối!'; }
        }
        loadBanner();
        setInterval(loadBanner, 4000);
    </script>
</body>
</html>
